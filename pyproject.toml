[project]
name = "mean-idea"
version = "0.1.0"
description = "Interpolate text in a diffusion language model's token-embedding space"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "accelerate>=1.10",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "transformers[vision]>=5.11",
]

[project.optional-dependencies]
cpu = ["torch==2.9.1", "torchvision==0.24.1"]
cuda = [
    "torch==2.9.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchvision==0.24.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
server = ["fastapi>=0.116", "uvicorn[standard]>=0.35"]

[project.scripts]
mean-idea = "mean_idea.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "corpnet"
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", extra = "cuda", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchvision = [
    { index = "pytorch-cu128", extra = "cuda", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
